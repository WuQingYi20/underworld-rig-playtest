<!DOCTYPE html>
<html lang="zh-CN">
<!-- 阴间赌坊 web shell (custom_html_shell of the "Web" preset), based on Godot 4.7's default godot.html.
     Replaces the Godot logo + progress bar with the game's own loading scene:
     a turning copper coin over a ghost flame, the title, and a row of soul lamps that light up
     as the download progresses. index.brush.ttf is copied next to it by scripts/export_web.sh. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>阴间赌坊</title>
<style>
@font-face { font-family: "UgBrush"; src: url("index.brush.ttf") format("truetype"); font-display: block; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #f2e8d5; background-color: #120d0c; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at 50% 40%, #2a1a18 0%, #120d0c 70%);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
  visibility: hidden; opacity: 1; transition: opacity 0.6s ease;
}
#status.fade { opacity: 0; }

#ug-coin { width: 150px; height: 150px; position: relative; }
#ug-coin svg { position: absolute; inset: 0; }
#ug-flame { animation: ug-flicker 1.6s ease-in-out infinite alternate; transform-origin: 50% 90%; }
#ug-face { animation: ug-turn 3.2s linear infinite; transform-origin: 50% 50%; }
@keyframes ug-flicker {
  0% { transform: scale(1, 1) skewX(0deg); opacity: 0.85; }
  50% { transform: scale(0.96, 1.08) skewX(-3deg); opacity: 1; }
  100% { transform: scale(1.03, 0.95) skewX(3deg); opacity: 0.8; }
}
@keyframes ug-turn {
  0% { transform: scaleX(1); } 25% { transform: scaleX(0.08); } 50% { transform: scaleX(-1); }
  75% { transform: scaleX(-0.08); } 100% { transform: scaleX(1); }
}

#ug-title { font-family: "UgBrush", serif; font-size: 64px; color: #e8cb62; letter-spacing: 10px; margin: 8px 0 4px;
  text-shadow: 0 3px 0 #7e1a15, 0 0 24px rgba(201, 162, 39, 0.25); }
#ug-sub { font-size: 14px; color: #8c847e; letter-spacing: 4px; margin-bottom: 34px; }

#ug-lamps { display: flex; gap: 14px; margin-bottom: 16px; }
.ug-lamp { width: 14px; height: 20px; border-radius: 7px 7px 5px 5px; background: #2a2220; border: 2px solid #4a4542;
  position: relative; transition: background 0.4s, box-shadow 0.4s, border-color 0.4s; }
.ug-lamp::before { content: ""; position: absolute; left: 5px; top: -6px; width: 2px; height: 5px; background: #4a4542; }
.ug-lamp.on { background: #b3261e; border-color: #e8742a; box-shadow: 0 0 10px 2px rgba(232, 116, 42, 0.55); }
.ug-lamp.on::after { content: ""; position: absolute; left: 3px; top: 4px; width: 4px; height: 8px; border-radius: 2px;
  background: #ffd27a; animation: ug-glow 1.2s ease-in-out infinite alternate; }
@keyframes ug-glow { from { opacity: 0.6; } to { opacity: 1; } }

#ug-pct { font-size: 15px; color: #cfc2aa; min-height: 20px; }
#ug-hint { font-size: 14px; color: #8c847e; margin-top: 10px; min-height: 20px; transition: opacity 0.4s; }

#status-notice { display: none; max-width: 560px; margin: 24px 2rem 0; padding: 1rem; text-align: center; line-height: 1.5;
  background: #3a1f1b; border: 2px solid #b3261e; border-radius: 8px; color: #f2e8d5; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background: #120d0c; }
  #ug-mobile { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center;
    background: #120d0c; color: #f2e8d5; font: 18px/1.6 serif; text-align: center; padding: 24px; }
  #ug-mobile button { margin-top: 16px; font-size: 16px; padding: 8px 18px; background: #3a1f1b; color: #f2e8d5;
    border: 2px solid #b3261e; border-radius: 8px; }
</style>
<script>
/* 阴间赌坊 playtest page (docs/playtest_web.md).
   UG_TELEMETRY_URL: where anonymous play events are POSTed (Google Apps Script
   /exec URL, see tools/telemetry_backend.gs). Empty = nothing is sent.
   The game pushes one JSON line per event through UG_track(); this page
   batches them, keeps unsent ones in localStorage, and sends what is left
   with sendBeacon when the tab is hidden or closed. */
window.UG_TELEMETRY_URL = "https://149.104.1.251/collect";
(function () {
  var KEY = "ug_queue_v1";
  var q = [];
  try { q = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { q = []; }
  var p = new URLSearchParams(location.search);
  window.UG_TESTER = (p.get("t") || p.get("tester") || "").replace(/[^\w\u4e00-\u9fa5-]/g, "").slice(0, 40);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(q.slice(-800))); } catch (e) {} }
  window.UG_track = function (line) { q.push(line); save(); if (q.length >= 25) window.UG_flush(false); };
  window.UG_flush = function (beacon) {
    if (!window.UG_TELEMETRY_URL || !q.length) return;
    var batch = q.splice(0, 150);
    save();
    var body = '{"events":[' + batch.join(",") + "]}";
    var back = function () { q = batch.concat(q); save(); };
    if (beacon && navigator.sendBeacon) {
      if (!navigator.sendBeacon(window.UG_TELEMETRY_URL, new Blob([body], { type: "text/plain" }))) back();
      return;
    }
    fetch(window.UG_TELEMETRY_URL, { method: "POST", body: body, mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: body.length < 60000 }).catch(back);
  };
  setInterval(function () { window.UG_flush(false); }, 10000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") window.UG_flush(true); });
  window.addEventListener("pagehide", function () { window.UG_flush(true); });
  window.addEventListener("error", function (ev) {
    window.UG_track(JSON.stringify({ e: "page_error", ts: Date.now() / 1000, props: { msg: String(ev.message).slice(0, 200) }, tester: window.UG_TESTER }));
  });
  // phones and tablets: the game needs a mouse and a 1280x720 screen
  window.addEventListener("DOMContentLoaded", function () {
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && !matchMedia("(pointer:fine)").matches);
    var gl = (function () { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
    if (mobile || !gl) {
      var d = document.createElement("div");
      d.id = "ug-mobile";
      d.style.display = "flex";
      d.innerHTML = "<div>" + (gl ? "这个试玩版需要用<b>电脑浏览器</b>（Chrome / Edge / Firefox）和鼠标来玩。" :
        "你的浏览器不支持 WebGL 2，游戏无法运行。请换用最新版 Chrome / Edge / Firefox。") +
        "<br><button onclick=\"this.parentNode.parentNode.remove()\">仍然继续</button></div>";
      document.body.appendChild(d);
    }
  });
})();
</script>

</head>
<body>
<canvas id="canvas">你的浏览器不支持 canvas。</canvas>
<noscript>需要开启 JavaScript 才能玩。</noscript>

<div id="status">
  <div id="ug-coin">
    <svg viewBox="0 0 160 160" aria-hidden="true">
      <defs>
        <linearGradient id="ugf" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#4E8487"/><stop offset="0.6" stop-color="#2F5D62"/>
          <stop offset="1" stop-color="#2F5D62" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="ugc" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#F3DC85"/><stop offset="0.55" stop-color="#C9A227"/><stop offset="1" stop-color="#8a6a17"/>
        </radialGradient>
      </defs>
      <g id="ug-flame">
        <path d="M80 4 C96 30 128 42 124 82 C121 108 103 118 80 118 C57 118 39 108 36 82 C33 54 58 50 62 26 C69 40 75 42 80 4 Z" fill="url(#ugf)"/>
      </g>
      <ellipse cx="80" cy="150" rx="40" ry="6" fill="#000" opacity="0.45"/>
      <g id="ug-face">
        <circle cx="80" cy="98" r="44" fill="#140F0F"/>
        <circle cx="80" cy="95" r="41" fill="url(#ugc)"/>
        <circle cx="80" cy="95" r="33" fill="none" stroke="#8a6a17" stroke-width="3"/>
        <rect x="66" y="81" width="28" height="28" fill="#140F0F" stroke="#8a6a17" stroke-width="3"/>
        <g fill="#7a5a14">
          <rect x="76" y="64" width="8" height="12" rx="2"/><rect x="76" y="114" width="8" height="12" rx="2"/>
          <rect x="49" y="91" width="12" height="8" rx="2"/><rect x="99" y="91" width="12" height="8" rx="2"/>
        </g>
      </g>
    </svg>
  </div>
  <div id="ug-title">阴间赌坊</div>
  <div id="ug-sub">· 试 玩 版 ·</div>
  <div id="ug-lamps"></div>
  <div id="ug-pct">&nbsp;</div>
  <div id="ug-hint">&nbsp;</div>
  <div id="status-notice"></div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6823408,"index.wasm":38817643},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const statusOverlay = document.getElementById('status');
  const statusNotice = document.getElementById('status-notice');
  const pct = document.getElementById('ug-pct');
  const hint = document.getElementById('ug-hint');
  const lampBox = document.getElementById('ug-lamps');
  const LAMPS = 12;
  const lamps = [];
  for (let i = 0; i < LAMPS; i++) {
    const l = document.createElement('div');
    l.className = 'ug-lamp';
    lampBox.appendChild(l);
    lamps.push(l);
  }
  const HINTS = [
    '正在给魂灯添油……',
    '鬼差在擦拭老虎机……',
    '账房先生在拨算盘……',
    '孟婆汤还在熬，稍等……',
    '纸钱正在一张张数清楚……',
    '第一次打开要下载十几 MB，之后会快很多',
  ];
  let hintIdx = 0;
  function nextHint() {
    hint.style.opacity = 0;
    setTimeout(() => { hint.textContent = HINTS[hintIdx++ % HINTS.length]; hint.style.opacity = 1; }, 400);
  }
  nextHint();
  const hintTimer = setInterval(nextHint, 3200);

  let initializing = true;
  let statusMode = '';

  function setStatusMode(mode) {
    if (statusMode === mode || !initializing) {
      return;
    }
    if (mode === 'hidden') {
      initializing = false;
      clearInterval(hintTimer);
      statusOverlay.classList.add('fade');
      setTimeout(() => statusOverlay.remove(), 650);
      return;
    }
    statusOverlay.style.visibility = 'visible';
    statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
    statusMode = mode;
  }

  function setProgress(f) {
    f = Math.max(0, Math.min(1, f));
    const n = Math.round(f * LAMPS);
    lamps.forEach((l, i) => l.classList.toggle('on', i < n));
    pct.textContent = f >= 1 ? '魂灯已全部点亮，正在开门……' : '已点亮 ' + n + ' / ' + LAMPS + ' 盏魂灯';
  }

  function setStatusNotice(text) {
    while (statusNotice.lastChild) {
      statusNotice.removeChild(statusNotice.lastChild);
    }
    text.split('\n').forEach((line) => {
      statusNotice.appendChild(document.createTextNode(line));
      statusNotice.appendChild(document.createElement('br'));
    });
  }

  function displayFailureNotice(err) {
    console.error(err);
    const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : '未知错误');
    setStatusNotice('游戏没能启动：\n' + msg + '\n请换用最新版 Chrome / Edge / Firefox 再试，或者刷新页面。');
    setStatusMode('notice');
    clearInterval(hintTimer);
    hint.textContent = '';
    initializing = false;
  }

  // A newer build was deployed: its service worker takes over (export/service_worker.js
  // skips waiting) and we load once more, so nobody plays a stale cached build.
  // sessionStorage stops a reload loop.
  function freshen() {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
      return Promise.resolve();
    }
    let done = false;
    try { done = sessionStorage.getItem('ug_sw_fresh') === '1'; } catch (e) { done = true; }
    return navigator.serviceWorker.getRegistration().then((reg) => {
      if (!reg) {
        return null;
      }
      return reg.update().catch(() => {}).then(() => {
        const next = reg.installing || reg.waiting;
        if (!next || done) {
          try { sessionStorage.removeItem('ug_sw_fresh'); } catch (e) {}
          return null;
        }
        try { sessionStorage.setItem('ug_sw_fresh', '1'); } catch (e) {}
        setStatusMode('progress');
        pct.textContent = '有新版本，正在更新……';
        return new Promise(() => {
          navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
          next.postMessage('update');   // an old Godot worker only moves on when asked
          // still stuck after a few seconds: throw the old worker away and load from the network
          setTimeout(() => reg.unregister().then(() => window.location.reload()), 6000);
        });
      });
    }).catch(() => null);
  }

  freshen().then(boot);

  function boot() {
  const missing = Engine.getMissingFeatures({
    threads: GODOT_THREADS_ENABLED,
  });

  if (missing.length !== 0) {
    // The threaded build needs cross-origin isolation. Hosts that cannot send the COOP/COEP
    // headers (GitHub Pages) get them from Godot's service worker, but only for pages loaded
    // after the worker is active, so reload once when it is. sessionStorage stops a reload loop.
    const canFix = GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator;
    let tried = false;
    try { tried = sessionStorage.getItem('ug_coi_reload') === '1'; } catch (e) { tried = true; }
    if (canFix && !tried) {
      setStatusMode('progress');
      pct.textContent = '正在准备……';
      try { sessionStorage.setItem('ug_coi_reload', '1'); } catch (e) {}
      navigator.serviceWorker.getRegistration().then((reg) => (reg ? null : engine.installServiceWorker()))
        .then(() => navigator.serviceWorker.ready)
        .then(() => window.location.reload())
        .catch((err) => displayFailureNotice(err));
    } else {
      displayFailureNotice('浏览器缺少这些功能：\n' + missing.join('\n'));
    }
  } else {
    try { sessionStorage.removeItem('ug_coi_reload'); } catch (e) {}
    setStatusMode('progress');
    setProgress(0);
    engine.startGame({
      'onProgress': function (current, total) {
        if (current > 0 && total > 0) {
          setProgress(current / total);
        }
      },
    }).then(() => {
      setProgress(1);
      setStatusMode('hidden');
    }, displayFailureNotice);
  }
  }
}());
</script>
</body>
</html>
