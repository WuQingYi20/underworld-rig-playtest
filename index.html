<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>阴间赌坊</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background: #120d0c; }
  #ug-mobile { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center;
    background: #120d0c; color: #f2e8d5; font: 18px/1.6 serif; text-align: center; padding: 24px; }
  #ug-mobile button { margin-top: 16px; font-size: 16px; padding: 8px 18px; background: #3a1f1b; color: #f2e8d5;
    border: 2px solid #b3261e; border-radius: 8px; }
</style>
<script>
/* 阴间赌坊 playtest page (docs/playtest_web.md).
   UG_TELEMETRY_URL: where anonymous play events are POSTed (Google Apps Script
   /exec URL, see tools/telemetry_backend.gs). Empty = nothing is sent.
   The game pushes one JSON line per event through UG_track(); this page
   batches them, keeps unsent ones in localStorage, and sends what is left
   with sendBeacon when the tab is hidden or closed. */
window.UG_TELEMETRY_URL = "https://149.104.1.251/collect";
(function () {
  var KEY = "ug_queue_v1";
  var q = [];
  try { q = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { q = []; }
  var p = new URLSearchParams(location.search);
  window.UG_TESTER = (p.get("t") || p.get("tester") || "").replace(/[^\w\u4e00-\u9fa5-]/g, "").slice(0, 40);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(q.slice(-800))); } catch (e) {} }
  window.UG_track = function (line) { q.push(line); save(); if (q.length >= 25) window.UG_flush(false); };
  window.UG_flush = function (beacon) {
    if (!window.UG_TELEMETRY_URL || !q.length) return;
    var batch = q.splice(0, 150);
    save();
    var body = '{"events":[' + batch.join(",") + "]}";
    var back = function () { q = batch.concat(q); save(); };
    if (beacon && navigator.sendBeacon) {
      if (!navigator.sendBeacon(window.UG_TELEMETRY_URL, new Blob([body], { type: "text/plain" }))) back();
      return;
    }
    fetch(window.UG_TELEMETRY_URL, { method: "POST", body: body, mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: body.length < 60000 }).catch(back);
  };
  setInterval(function () { window.UG_flush(false); }, 10000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") window.UG_flush(true); });
  window.addEventListener("pagehide", function () { window.UG_flush(true); });
  window.addEventListener("error", function (ev) {
    window.UG_track(JSON.stringify({ e: "page_error", ts: Date.now() / 1000, props: { msg: String(ev.message).slice(0, 200) }, tester: window.UG_TESTER }));
  });
  // phones and tablets: the game needs a mouse and a 1280x720 screen
  window.addEventListener("DOMContentLoaded", function () {
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && !matchMedia("(pointer:fine)").matches);
    var gl = (function () { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
    if (mobile || !gl) {
      var d = document.createElement("div");
      d.id = "ug-mobile";
      d.style.display = "flex";
      d.innerHTML = "<div>" + (gl ? "这个试玩版需要用<b>电脑浏览器</b>（Chrome / Edge / Firefox）和鼠标来玩。" :
        "你的浏览器不支持 WebGL 2，游戏无法运行。请换用最新版 Chrome / Edge / Firefox。") +
        "<br><button onclick=\"this.parentNode.parentNode.remove()\">仍然继续</button></div>";
      document.body.appendChild(d);
    }
  });
})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6472744,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
